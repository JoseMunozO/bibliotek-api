spring.application.name=bibliotek-api

# Railway/Render m.fl. anger porten via PORT; lokalt 8090 (kan även ändras med SERVER_PORT)
server.port=${PORT:8090}

# Kommaseparerade origins som får anropa API:t. Stöder mönster med *,
# t.ex. https://bibliotek-react-ts*.vercel.app för Vercels preview-URL:er.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Onlinedemo: återställ exempeldata från bibliotek.sql. Avstängt som standard
# (påverkar aldrig den lokala databasen om variablerna inte är satta).
# DEMO_RESET_CRON: Spring-cron med 6 fält, t.ex. "0 0 4 * * *" = varje natt kl. 04:00. "-" = av.
app.demo.reset-cron=${DEMO_RESET_CRON:-}
app.demo.reset-zone=${DEMO_RESET_ZONE:Europe/Stockholm}
# DEMO_INIT_IF_EMPTY=true: ladda exempeldata vid start om databasen saknar tabeller
app.demo.init-if-empty=${DEMO_INIT_IF_EMPTY:false}
